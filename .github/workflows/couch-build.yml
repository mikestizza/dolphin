name: Couch build (Windows x64)

on:
  push:
    branches: [couch-overlay]
  workflow_dispatch:

concurrency:
  group: couch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: couch-win-x64
          variant: sccache
          max-size: 2G

      - name: Configure
        shell: pwsh
        run: >
          cmake --preset ninja-release-x64
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        shell: pwsh
        run: cmake --build --preset ninja-build-release-x64 --target dolphin-emu

      - name: Package
        shell: pwsh
        run: |
          $out = "build/release/x64/Binaries"
          Remove-Item "$out/*.pdb", "$out/*.ilk", "$out/*.lib", "$out/*.exp" -ErrorAction SilentlyContinue
          $sha = (git rev-parse --short HEAD)
          "couch-overlay $sha built $(Get-Date -Format o)" | Out-File "$out/couch_build.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "dist/Dolphin-couch-$sha.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-couch-x64
          path: dist/*.zip
          retention-days: 30
