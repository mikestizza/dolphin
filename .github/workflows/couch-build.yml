name: Couch Potato Edition build (Windows x64)

on:
  push:
    branches: [couch-overlay]
  workflow_dispatch:

concurrency:
  group: couch-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: couch-win-x64
          variant: sccache
          max-size: 2G

      - name: Configure
        shell: pwsh
        run: >
          cmake --preset ninja-release-x64
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        shell: pwsh
        run: cmake --build --preset ninja-build-release-x64 --target dolphin-emu

      - name: Package
        shell: pwsh
        run: |
          $out = "build/release/x64/Binaries"
          Remove-Item "$out/*.pdb", "$out/*.ilk", "$out/*.lib", "$out/*.exp" -ErrorAction SilentlyContinue
          $sha = (git rev-parse --short HEAD)
          "Dolphin Couch Potato Edition $sha built $(Get-Date -Format o)" | Out-File "$out/couch_build.txt"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "dist/Dolphin-CouchPotato-x64.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-CouchPotato-x64
          path: dist/*.zip
          retention-days: 30

      - name: Publish rolling release
        if: github.ref == 'refs/heads/couch-overlay'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git rev-parse --short HEAD)
          # Version of the official Dolphin release this build is based on, e.g. 2609a-10.
          $ver = (git describe --tags --match "[0-9][0-9][0-9][0-9]*" HEAD)
          $subject = (git log -1 --format=%s)
          # First run has no release to delete; ignore that failure.
          try { & gh release delete couch-latest --cleanup-tag --yes 2>&1 | Out-Null } catch {}
          $global:LASTEXITCODE = 0
          $notes = "Latest Dolphin Couch Potato Edition build (couch-overlay branch), based on Dolphin $ver.`n`nCommit $sha`: $subject`n`nExtract over a copy of your Dolphin folder (keep your User folder / portable.txt)."
          gh release create couch-latest dist/Dolphin-CouchPotato-x64.zip --prerelease --target $env:GITHUB_SHA --title "Dolphin Couch Potato Edition $ver ($sha)" --notes $notes
